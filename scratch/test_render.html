<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Scroll Rod Redesign Refinements</title>
<style>
  body {
    background: #140b06 radial-gradient(circle at 50% 30%, #2a150a 0%, #0d0603 100%);
    color: #e5d2b8;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    margin: 0;
  }
  h2 {
    margin: 0 0 10px;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #dfa742;
  }
  .stage-preview {
    width: 660px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(0,0,0,0.3);
    padding: 24px 20px;
    border-radius: 12px;
    border: 1px solid rgba(212, 160, 50, 0.2);
  }
  .mock-parchment {
    width: 84%;
    max-width: 580px;
    height: 84px;
    background: linear-gradient(165deg, #fbf3e2 0%, #f0dcaf 48%, #deb878 100%);
    position: relative;
    box-shadow: inset 0 0 40px rgba(65, 35, 10, 0.48), 0 14px 30px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: serif;
    font-size: 22px;
    color: #1f0e03;
    letter-spacing: 4px;
    font-weight: bold;
    border-radius: 2px;
    margin: -5px 0;
  }
  .mock-parchment::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 26px;
    background: linear-gradient(180deg, rgba(44, 21, 6, 0.6) 0%, transparent 100%);
  }

  .scroll-rod-row {
    position: relative;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;
  }

  /* ================= OPTION D: IMPERIAL TURNED BALUSTER (SEAMLESS) ================= */
  .rod-d .scroll-rod-bar {
    width: 84%;
    max-width: 580px;
    height: 22px;
    border-radius: 4px;
    background: linear-gradient(180deg,
      #fffbe6 0%,
      #fae18c 12%,
      #dfa742 28%,
      #9a5e18 48%,
      #3d1803 72%,
      #1a0802 85%,
      #461f05 93%,
      #9c6622 100%
    );
    box-shadow:
      inset 0 1.5px 1.5px rgba(255, 255, 255, 0.85),
      inset 0 -2px 3px rgba(0, 0, 0, 0.9),
      0 6px 20px rgba(0, 0, 0, 0.85),
      0 0 20px rgba(220, 155, 45, 0.35);
    position: relative;
    z-index: 2;
  }

  .rod-d .scroll-finial {
    width: 72px;
    height: 64px;
    flex: 0 0 auto;
    margin: 0 -14px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 10px rgba(220, 155, 45, 0.4));
    z-index: 5;
  }
  .rod-d .scroll-finial.right { transform: scaleX(-1); }

  /* ================= OPTION E: ORNATE ROYAL ACORN & LOTUS BUD ================= */
  .rod-e .scroll-rod-bar {
    width: 84%;
    max-width: 580px;
    height: 22px;
    border-radius: 4px;
    background: linear-gradient(180deg,
      #fffce8 0%,
      #fae18c 12%,
      #e0a840 28%,
      #9c6019 48%,
      #3b1703 72%,
      #180802 85%,
      #441f05 93%,
      #986420 100%
    );
    box-shadow:
      inset 0 1.5px 1.5px rgba(255, 255, 255, 0.85),
      inset 0 -2px 3px rgba(0, 0, 0, 0.9),
      0 6px 20px rgba(0, 0, 0, 0.85),
      0 0 20px rgba(220, 155, 45, 0.35);
    position: relative;
    z-index: 2;
  }
  .rod-e .scroll-finial {
    width: 76px;
    height: 64px;
    flex: 0 0 auto;
    margin: 0 -14px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 12px rgba(220, 155, 45, 0.45));
    z-index: 5;
  }
  .rod-e .scroll-finial.right { transform: scaleX(-1); }

  /* ================= OPTION F: SLEEK COSMIC SCEPTER WITH RADIANT GEMS ================= */
  .rod-f .scroll-rod-bar {
    width: 84%;
    max-width: 580px;
    height: 22px;
    border-radius: 4px;
    background: linear-gradient(180deg,
      #ffffff 0%,
      #fae18c 14%,
      #d49830 30%,
      #8c4f14 50%,
      #321303 72%,
      #150601 85%,
      #3e1b04 93%,
      #8f5c1c 100%
    );
    box-shadow:
      inset 0 1.5px 1.5px rgba(255, 255, 255, 0.9),
      inset 0 -2px 3px rgba(0, 0, 0, 0.95),
      0 6px 20px rgba(0, 0, 0, 0.85),
      0 0 24px rgba(220, 155, 45, 0.4);
    position: relative;
    z-index: 2;
  }
  .rod-f .scroll-finial {
    width: 76px;
    height: 64px;
    flex: 0 0 auto;
    margin: 0 -14px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 12px rgba(220, 155, 45, 0.45));
    z-index: 5;
  }
  .rod-f .scroll-finial.right { transform: scaleX(-1); }
</style>
</head>
<body>

  <!-- ================= OPTION D ================= -->
  <div class="stage-preview">
    <h2>Option D: Royal Turned Baluster (Seamless Ferrule & Fluted Pommel)</h2>
    <div class="scroll-rod-row rod-d">
      <svg class="scroll-finial" viewBox="0 0 76 64"><use href="#finial-d" /></svg>
      <div class="scroll-rod-bar"></div>
      <svg class="scroll-finial right" viewBox="0 0 76 64"><use href="#finial-d" /></svg>
    </div>
    <div class="mock-parchment">DATATHON</div>
  </div>

  <!-- ================= OPTION E ================= -->
  <div class="stage-preview">
    <h2>Option E: Imperial Acorn Pommel & Royal Spearhead Tip</h2>
    <div class="scroll-rod-row rod-e">
      <svg class="scroll-finial" viewBox="0 0 80 64"><use href="#finial-e" /></svg>
      <div class="scroll-rod-bar"></div>
      <svg class="scroll-finial right" viewBox="0 0 80 64"><use href="#finial-e" /></svg>
    </div>
    <div class="mock-parchment">DATATHON</div>
  </div>

  <!-- ================= OPTION F ================= -->
  <div class="stage-preview">
    <h2>Option F: Mythic Vedic Chakra & Lotus Crown Finial</h2>
    <div class="scroll-rod-row rod-f">
      <svg class="scroll-finial" viewBox="0 0 80 64"><use href="#finial-f" /></svg>
      <div class="scroll-rod-bar"></div>
      <svg class="scroll-finial right" viewBox="0 0 80 64"><use href="#finial-f" /></svg>
    </div>
    <div class="mock-parchment">DATATHON</div>
  </div>

  <!-- SVG DEFS -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <!-- Cylindrical gold for collars & rods -->
      <linearGradient id="goldCylinder" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fff8d2" />
        <stop offset="12%" stop-color="#fae28e" />
        <stop offset="28%" stop-color="#dfa742" />
        <stop offset="52%" stop-color="#8a4f14" />
        <stop offset="78%" stop-color="#2a1103" />
        <stop offset="92%" stop-color="#562807" />
        <stop offset="100%" stop-color="#a86e22" />
      </linearGradient>

      <!-- Spherical 3D shading for pommel bulbs -->
      <radialGradient id="pommelRadial" cx="35%" cy="24%" r="72%">
        <stop offset="0%" stop-color="#fffef0" />
        <stop offset="20%" stop-color="#fce288" />
        <stop offset="48%" stop-color="#c98622" />
        <stop offset="78%" stop-color="#542306" />
        <stop offset="100%" stop-color="#180701" />
      </radialGradient>

      <!-- Solar Topaz Gemstone -->
      <radialGradient id="solarGem" cx="30%" cy="26%" r="68%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="22%" stop-color="#ffe68e" />
        <stop offset="58%" stop-color="#ea580c" />
        <stop offset="88%" stop-color="#7c1c04" />
        <stop offset="100%" stop-color="#2a0601" />
      </radialGradient>

      <!-- ================= FINIAL D ================= -->
      <g id="finial-d">
        <!-- 1. Ferrule / Sleeve: seamlessly overlaps the rod cylinder (X=54..76) -->
        <rect x="56" y="20.5" width="20" height="23" rx="1.5" fill="url(#goldCylinder)" stroke="#3d1903" stroke-width="0.7" />
        <!-- Stepped Beveled Ring at rod entrance -->
        <rect x="52" y="18" width="6" height="28" rx="2" fill="url(#goldCylinder)" stroke="#fce392" stroke-width="0.8" />
        <line x1="55" y1="18.5" x2="55" y2="45.5" stroke="#ffeaa0" stroke-width="0.8" opacity="0.9" />

        <!-- 2. Lathe-Turned Waist (X=42..52) -->
        <path d="M 52,21 C 48,23 45,24 43,24 L 43,40 C 45,41 48,41 52,43 Z" fill="url(#goldCylinder)" />
        <!-- Torus Bead -->
        <ellipse cx="42.5" cy="32" rx="3" ry="12" fill="url(#goldCylinder)" stroke="#ffeaa0" stroke-width="0.7" />
        <ellipse cx="42" cy="23" rx="1.6" ry="1" fill="#ffffff" opacity="0.75" />

        <!-- 3. Royal Pommel Bulb (X=14..40) -->
        <path
          d="M 40,23
             C 36,15 31,8 23,8
             C 14,8 11,18 11,24
             L 11,40
             C 11,46 14,56 23,56
             C 31,56 36,49 40,41 Z"
          fill="url(#pommelRadial)"
          stroke="#4a2104"
          stroke-width="1.1"
        />

        <!-- Top Petal Flute highlight -->
        <path
          d="M 39,24
             C 33,15 28,10 23,10
             C 16,10 13,18 13,23
             C 20,21 30,21 39,24 Z"
          fill="#fff5ca"
          opacity="0.65"
        />
        <ellipse cx="23" cy="13.5" rx="7.5" ry="2.2" fill="#ffffff" opacity="0.8" />

        <!-- Bottom Petal Flute core shadow -->
        <path
          d="M 39,40
             C 33,49 28,54 23,54
             C 16,54 13,46 13,41
             C 20,43 30,43 39,40 Z"
          fill="#160601"
          opacity="0.75"
        />

        <!-- Carved Longitudinal Ribs -->
        <path d="M 38,28 C 30,26 21,26 12,30" fill="none" stroke="#683409" stroke-width="0.8" opacity="0.7" />
        <path d="M 38,36 C 30,38 21,38 12,34" fill="none" stroke="#2a1003" stroke-width="0.8" opacity="0.7" />

        <!-- Central Gemstone Medallion -->
        <circle cx="23" cy="32" r="8.5" fill="url(#goldCylinder)" stroke="#fae18c" stroke-width="1.1" />
        <circle cx="23" cy="32" r="6.6" fill="#2d1203" />
        <circle cx="23" cy="32" r="5.2" fill="url(#solarGem)" stroke="#ffd777" stroke-width="0.8" />
        <circle cx="21.2" cy="30.2" r="1.5" fill="#ffffff" opacity="0.95" />
        <circle cx="24.5" cy="33.5" r="0.7" fill="#ffffff" opacity="0.6" />

        <!-- 4. Spire Tip (X=1..12) -->
        <rect x="9.5" y="24.5" width="3" height="15" rx="1.5" fill="url(#goldCylinder)" stroke="#f7d58b" stroke-width="0.6" />
        <path
          d="M 10,26
             C 8,26 5,28 1,32
             C 5,36 8,38 10,38 Z"
          fill="url(#goldCylinder)"
          stroke="#4e2104"
          stroke-width="0.8"
        />
        <path d="M 10,26 C 8,26 5,28 1,32 L 10,32 Z" fill="#fff3bd" opacity="0.65" />
        <path d="M 1,32 L 3,30.5 L 5,32 L 3,33.5 Z" fill="#ffffff" opacity="0.95" />
        <circle cx="1" cy="32" r="1.2" fill="#ffffff" />
      </g>

      <!-- ================= FINIAL E: IMPERIAL ACORN & SPEARHEAD ================= -->
      <g id="finial-e">
        <!-- Sleeve Socket -->
        <rect x="60" y="20.5" width="20" height="23" rx="1.5" fill="url(#goldCylinder)" stroke="#3d1903" stroke-width="0.7" />
        <!-- Stepped Beveled Ferrule Collar with Filigree Rings -->
        <rect x="54" y="17.5" width="7" height="29" rx="2" fill="url(#goldCylinder)" stroke="#ffeaa0" stroke-width="0.8" />
        <line x1="57.5" y1="18" x2="57.5" y2="46" stroke="#4a2003" stroke-width="0.9" />

        <!-- Lathe Waist with dual stepped rings -->
        <path d="M 54,21 C 49,23 46,24 44,24 L 44,40 C 46,40 49,41 54,43 Z" fill="url(#goldCylinder)" />
        <ellipse cx="44" cy="32" rx="3.2" ry="12.5" fill="url(#goldCylinder)" stroke="#ffeaa0" stroke-width="0.8" />
        <ellipse cx="38" cy="32" rx="2.5" ry="14" fill="url(#goldCylinder)" stroke="#fce392" stroke-width="0.8" />

        <!-- Sculpted Imperial Acorn Bulb (longer, more tapered silhouette) -->
        <path
          d="M 37,23
             C 33,14 27,6 18,6
             C 10,6 7,16 6,24
             L 6,40
             C 7,48 10,58 18,58
             C 27,58 33,50 37,41 Z"
          fill="url(#pommelRadial)"
          stroke="#4a2104"
          stroke-width="1.2"
        />

        <!-- Top Acorn Cap Highlight -->
        <path
          d="M 36,23
             C 31,14 26,8 18,8
             C 12,8 9,16 8,23
             C 16,21 27,21 36,23 Z"
          fill="#fff6cb"
          opacity="0.7"
        />
        <ellipse cx="18" cy="11.5" rx="8" ry="2.2" fill="#ffffff" opacity="0.85" />

        <!-- Bottom Shadow -->
        <path
          d="M 36,41
             C 31,50 26,56 18,56
             C 12,56 9,48 8,41
             C 16,43 27,43 36,41 Z"
          fill="#140501"
          opacity="0.8"
        />

        <!-- Fluted Leaf Engravings -->
        <path d="M 35,29 C 26,27 18,27 7,30" fill="none" stroke="#683409" stroke-width="0.8" opacity="0.65" />
        <path d="M 35,35 C 26,37 18,37 7,34" fill="none" stroke="#2a1003" stroke-width="0.8" opacity="0.65" />

        <!-- Center Ruby / Topaz Cabochon inside Ornate Star Mount -->
        <circle cx="18" cy="32" r="9" fill="url(#goldCylinder)" stroke="#fae18c" stroke-width="1.1" />
        <circle cx="18" cy="32" r="7" fill="#2d1203" />
        <circle cx="18" cy="32" r="5.4" fill="url(#solarGem)" stroke="#ffd777" stroke-width="0.8" />
        <circle cx="16.2" cy="30.2" r="1.5" fill="#ffffff" opacity="0.95" />

        <!-- Royal Spearhead / Fleur Tip extending outwards (X=0..6) -->
        <path
          d="M 6,24
             C 4,24 2,28 0,32
             C 2,36 4,40 6,40 Z"
          fill="url(#goldCylinder)"
          stroke="#4e2104"
          stroke-width="0.8"
        />
        <path d="M 6,24 C 4,24 2,28 0,32 L 6,32 Z" fill="#fff5ca" opacity="0.7" />
        <circle cx="0.5" cy="32" r="1.2" fill="#ffffff" />
      </g>

      <!-- ================= FINIAL F: MYTHIC VEDIC CHAKRA & LOTUS ================= -->
      <g id="finial-f">
        <!-- Socket -->
        <rect x="62" y="20.5" width="18" height="23" rx="1.5" fill="url(#goldCylinder)" stroke="#3d1903" stroke-width="0.7" />
        <!-- Stepped Beveled Ferrule -->
        <rect x="56" y="17.5" width="7" height="29" rx="2" fill="url(#goldCylinder)" stroke="#ffeaa0" stroke-width="0.8" />

        <!-- Turned Lathe Neck with stepped ring -->
        <path d="M 56,21 C 51,23 48,24 46,24 L 46,40 C 48,40 51,41 56,43 Z" fill="url(#goldCylinder)" />
        <ellipse cx="46" cy="32" rx="3.5" ry="13" fill="url(#goldCylinder)" stroke="#ffeaa0" stroke-width="0.8" />

        <!-- Kalash Kumbha / Urn Bulb with graceful outward flare -->
        <path
          d="M 45,23
             C 40,14 34,7 25,7
             C 17,7 13,16 11,22
             C 8,22 4,27 0.5,32
             C 4,37 8,42 11,42
             C 13,48 17,57 25,57
             C 34,57 40,50 45,41 Z"
          fill="url(#pommelRadial)"
          stroke="#4a2104"
          stroke-width="1.2"
        />

        <!-- Lotus Petal Cusp Highlight -->
        <path
          d="M 43,24
             C 36,15 31,9 25,9
             C 18,9 14,17 12,23
             C 22,21 33,21 43,24 Z"
          fill="#fff5ca"
          opacity="0.75"
        />
        <ellipse cx="25" cy="12.5" rx="8.5" ry="2.2" fill="#ffffff" opacity="0.85" />

        <!-- Lotus Petal Base Shadow -->
        <path
          d="M 43,40
             C 36,49 31,55 25,55
             C 18,55 14,47 12,41
             C 22,43 33,43 43,40 Z"
          fill="#140501"
          opacity="0.8"
        />

        <!-- Lotus Shikhara Spire Tip -->
        <path
          d="M 12,24 C 8,24 4,28 0.5,32 C 4,36 8,40 12,40 Z"
          fill="url(#goldCylinder)"
          stroke="#4e2104"
          stroke-width="0.9"
        />
        <path d="M 12,24 C 8,24 4,28 0.5,32 L 12,32 Z" fill="#fff8d2" opacity="0.7" />

        <!-- 8-Point Cosmic Sunburst Chakra Ring in Center -->
        <circle cx="26" cy="32" r="9.5" fill="url(#goldCylinder)" stroke="#fae18c" stroke-width="1.1" />
        <circle cx="26" cy="32" r="7.2" fill="#2d1203" />
        <circle cx="26" cy="32" r="5.6" fill="url(#solarGem)" stroke="#ffd777" stroke-width="0.8" />
        <circle cx="24.2" cy="30.2" r="1.6" fill="#ffffff" opacity="0.95" />

        <!-- Chakra Rays -->
        <line x1="26" y1="20" x2="26" y2="22.5" stroke="#ffeaa0" stroke-width="1.2" stroke-linecap="round" />
        <line x1="26" y1="41.5" x2="26" y2="44" stroke="#ffeaa0" stroke-width="1.2" stroke-linecap="round" />
        <line x1="14" y1="32" x2="16.5" y2="32" stroke="#ffeaa0" stroke-width="1.2" stroke-linecap="round" />
        <line x1="35.5" y1="32" x2="38" y2="32" stroke="#ffeaa0" stroke-width="1.2" stroke-linecap="round" />

        <!-- Apex Diamond Glint -->
        <path d="M 0.5,32 L 2.5,30.5 L 4.5,32 L 2.5,33.5 Z" fill="#ffffff" opacity="0.95" />
        <circle cx="0.5" cy="32" r="1.3" fill="#ffffff" />
      </g>
    </defs>
  </svg>

</body>
</html>
